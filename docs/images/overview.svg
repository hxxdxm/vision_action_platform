<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <clipPath id="card"><rect width="252" height="208" rx="16"/></clipPath>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="#1c1c1e"/>
  <rect x="0.75" y="0.75" width="958.5" height="298.5" rx="17.5" fill="none" stroke="#424246" stroke-width="1.5"/>
  <g stroke="#22c55e" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.85">
    <line x1="300" y1="150" x2="344" y2="150" marker-end="url(#arr)"/>
    <line x1="614" y1="150" x2="658" y2="150" marker-end="url(#arr)"/>
  </g>
  <!-- 카드 3개: 입력 → 결과 → 관리 (진하기만 다른 초록) -->
  <g transform="translate(40,46)">
    <rect width="252" height="208" rx="16" fill="#262628" stroke="#424246" stroke-width="1.5"/>
    <rect width="252" height="6" fill="#166534" clip-path="url(#card)"/>
    <text x="24" y="44" font-size="13" font-weight="700" fill="#86efac" letter-spacing="2">STEP 1</text>
    <text x="24" y="84" font-size="28" font-weight="800" fill="#f5f5f5">입력</text>
    <text x="24" y="130" font-size="16" fill="#d4d4d4">MP4 영상 업로드</text>
    <text x="24" y="158" font-size="16" fill="#d4d4d4">IP Webcam 8초 촬영</text>
  </g>
  <g transform="translate(354,46)">
    <rect width="252" height="208" rx="16" fill="#262628" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect width="252" height="6" fill="#15803d" clip-path="url(#card)"/>
    <text x="24" y="44" font-size="13" font-weight="700" fill="#86efac" letter-spacing="2">STEP 2</text>
    <text x="24" y="84" font-size="28" font-weight="800" fill="#f5f5f5">결과</text>
    <text x="24" y="130" font-size="16" fill="#d4d4d4">사람별 동작 6종</text>
    <text x="24" y="158" font-size="16" fill="#d4d4d4">Confidence · 판단 근거</text>
  </g>
  <g transform="translate(668,46)">
    <rect width="252" height="208" rx="16" fill="#262628" stroke="#424246" stroke-width="1.5"/>
    <rect width="252" height="6" fill="#16a34a" clip-path="url(#card)"/>
    <text x="24" y="44" font-size="13" font-weight="700" fill="#86efac" letter-spacing="2">STEP 3</text>
    <text x="24" y="84" font-size="28" font-weight="800" fill="#f5f5f5">관리</text>
    <text x="24" y="130" font-size="16" fill="#d4d4d4">Django Admin</text>
    <text x="24" y="158" font-size="16" fill="#d4d4d4">대시보드 통계</text>
